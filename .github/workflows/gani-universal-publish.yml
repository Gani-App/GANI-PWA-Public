name: GANI Android Direct Download
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/gani-universal-publish.yml'
permissions:
  contents: write
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build GANI APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - name: Publish stable direct-download APK
        run: |
          mkdir -p download
          cp android/app/build/outputs/apk/debug/app-debug.apk download/GANI-Android.apk
          sha256sum download/GANI-Android.apk > download/GANI-Android.apk.sha256
          git config user.name 'GANI Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add download/GANI-Android.apk download/GANI-Android.apk.sha256
          if ! git diff --cached --quiet; then
            git commit -m 'Publish GANI Android direct download'
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: GANI-Android
          path: |
            download/GANI-Android.apk
            download/GANI-Android.apk.sha256
